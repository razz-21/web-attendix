<div class="user-table-wrap">
  <table mat-table [dataSource]="dataSource" class="user-table">
    <ng-container matColumnDef="rfid">
      <th mat-header-cell *matHeaderCellDef scope="col">ID</th>
      <td mat-cell *matCellDef="let row">{{ row.rfid }}</td>
    </ng-container>

    <ng-container matColumnDef="fullname">
      <th mat-header-cell *matHeaderCellDef scope="col">Full name</th>
      <td mat-cell *matCellDef="let row">{{ fullName(row) }}</td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef scope="col">Email</th>
      <td mat-cell *matCellDef="let row">{{ row.email }}</td>
    </ng-container>

    <ng-container matColumnDef="department">
      <th mat-header-cell *matHeaderCellDef scope="col">Department</th>
      <td mat-cell *matCellDef="let row">{{ row.department }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef scope="col">Status</th>
      <td mat-cell *matCellDef="let row">
        <span class="app-table-status-pill">{{ formatStatus(row.status) }}</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef scope="col" class="app-table-actions-header">Actions</th>
      <td mat-cell *matCellDef="let row" class="app-table-actions-cell">
        <button
          matIconButton
          type="button"
          class="user-table__action-btn"
          (click)="viewUser(row)"
          aria-label="View user"
          matTooltip="View user"
          matTooltipPosition="above"
        >
          <mat-icon>visibility</mat-icon>
        </button>

        <button
          matIconButton
          type="button"
          class="user-table__action-btn"
          (click)="viewUser(row)"
          aria-label="Delete user"
          matTooltip="Delete user"
          matTooltipPosition="above"
        >
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
