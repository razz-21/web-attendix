<section class="qrcode-modal">
  <section class="qrcode-modal__header">
    <h3>QR Code</h3>
    <p>Scan this QR code to open the public attendance page and mark your attendance.</p>
  </section>

  <section class="qrcode-modal__body">

    @if (enableOtc) {
      <div class="qrcode-modal_otc">
        <span class="qrcode-modal_otc-code">{{ otc() }}</span>
        <span class="qrcode-modal_otc-timer">{{ expiresIn() }}s</span>
      </div>
    }

    @if (qrError()) {
      <div class="qrcode-modal__error">
        <mat-icon>error_outline</mat-icon>
        <span>{{ qrError() }}</span>
      </div>
    } @else {
      <div class="qrcode-modal__qr-wrap">
        <div class="qrcode-modal__qr" [innerHTML]="qrCodeSvg()"></div>
      </div>
    }
  </section>

  <section class="qrcode-modal__actions">
    <button matButton="filled" color="primary" type="button" (click)="closeDialog()">Close</button>
  </section>
</section>
