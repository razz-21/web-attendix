<div class="attendees-page">
  <div class="attendees-page-header">
    <div class="page-header">
      <div class="page-title">Attendees</div>
    </div>

    <div class="attendees-page-header-actions" style="display: flex; gap: 0.5rem;">
      <button mat-stroked-button color="primary" type="button" (click)="openImport()">
        <mat-icon>group_add</mat-icon>
        Import from Group
      </button>
      <button mat-flat-button color="primary" type="button" (click)="openCreate()">
        Add Attendee
      </button>
    </div>
  </div>

  <div class="attendees-page-content">
    <app-attendee-table [attendanceId]="attendanceId()"></app-attendee-table>
  </div>
</div>
