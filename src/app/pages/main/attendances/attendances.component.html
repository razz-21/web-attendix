<div class="attendances-page">
  <div class="attendances-page-header">
    <div class="page-header">
      <div class="page-title">Attendances</div>
      <div class="page-description">Manage attendance configurations and schedules.</div>
    </div>

    <div class="attendances-page-header-actions">
      <button matButton="filled" color="primary" type="button" (click)="openAddAttendance()">
        Add new attendance
      </button>
    </div>
  </div>

  <div class="attendance-filter">
    <mat-form-field appearance="outline" class="attendance-filter__search">
      <mat-icon matPrefix>search</mat-icon>
      <input matInput placeholder="Search attendances" [ngModel]="searchQuery()" (ngModelChange)="searchAttendances($event)" />
      @if(searchQuery()) {
        <button mat-icon-button matSuffix type="button" (click)="clearSearchAttendances()">
          <mat-icon>close</mat-icon>
        </button>
      }
    </mat-form-field>

    <mat-form-field appearance="outline" class="attendance-filter__status">
      <mat-label>Status</mat-label>
      <mat-select [ngModel]="statusFilter()" (ngModelChange)="filterAttendancesByStatus($event)">
        <mat-option value="active">Active</mat-option>
        <mat-option value="archived">Archived</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <div class="attendances-page-content">
    <app-attendance-table [attendances]="attendances()" [loading]="loading()" (attendanceArchived)="onArchiveAttendance($event)" (attendanceSetAsActive)="onSetAttendanceAsActive($event)" />
  </div>
</div>
