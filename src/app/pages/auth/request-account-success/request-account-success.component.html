<div class="request-account-success-page">
  <mat-card appearance="outlined" class="success-card">
    <mat-card-content>
      <div class="success-layout">
        <mat-icon class="success-icon" aria-hidden="true">mark_email_read</mat-icon>
        <h1 class="mat-title-medium success-title">Account request submitted</h1>
        <p class="mat-body-medium success-message">
          Your account was created successfully. Please wait while an administrator verifies your account—you will receive an email when it is ready.
        </p>
        <a matButton="filled" color="primary" class="login-link" [routerLink]="loginPath">Back to login</a>
      </div>
    </mat-card-content>
  </mat-card>
</div>
