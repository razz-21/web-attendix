<mat-card appearance="outlined" class="login-card">
  <mat-card-content>
    <div class="login-brand">
      <img src="/assets/logo/attendix-logo.svg" alt="Attendix" width="52" height="52" class="logo" />
      <h1 class="mat-title-medium">Welcome to Attendix</h1>
      <p class="mat-body-medium">Enter your email and password to access your account.</p>
    </div>

    <form class="login-fields" [formGroup]="form" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="email" placeholder="name@company.com" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input
          matInput
          type="password"
          formControlName="password"
          autocomplete="current-password"
        />
      </mat-form-field>

      <div class="login-buttons">
        <button type="submit" matButton="filled" color="primary" class="full-width">Sign in</button>
        <div class="login-request-account">
          <p>Don't have an account? You can request one below.</p>
          <button type="button" matButton="tonal" color="primary" class="full-width" (click)="navigateToRequestAccount()">Request an account</button>
        </div>
      </div>
    </form>
  </mat-card-content>
</mat-card>
